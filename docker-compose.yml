services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      EMBEDDED_REDIS: "1"
      REDIS_URL: redis://127.0.0.1:6379/0
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
